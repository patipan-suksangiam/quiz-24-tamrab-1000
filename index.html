            margin-bottom: 30px;

            padding: 14px 18px;
            border-radius: 8px;
            margin-bottom: 25px;
            font-size: 14px;
            color: #312e81;
        }
        .question-card {
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .question-title {
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 12px;
            color: #1e293b;
        }
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .option-label {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.15s;
            font-size: 14px;
        }
        .option-label:hover {
            background: #f1f5f9;
        }
        .explanation {
            margin-top: 12px;
            padding: 10px 14px;
            background: #f0fdf4;
            border-left: 3px solid var(--success);
            border-radius: 6px;
            font-size: 13px;
            color: #166534;
            display: none;
        }
        .incorrect-explanation {
            background: #fef2f2;
            border-left-color: var(--error);
            color: #991b1b;
        }
        .btn-action {
            display: block;
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 16px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 30px;
            box-shadow: 0 4px 15px rgba(79, 70, 229, 0.3);
            text-align: center;
        }
        .btn-action:hover {
            background: var(--primary-hover);
        }
        #results-container {
            display: none;
            margin-top: 30px;
            padding: 25px;
            background: #f8fafc;
            border: 2px dashed var(--primary);
            border-radius: 12px;
            text-align: center;
        }

            font-size: 34px;
            font-weight: bold;
            color: var(--primary);
            margin: 10px 0;
        }

    let activeQuestions = [];
    let isSubmitted = false;

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function startNewQuiz() {
        isSubmitted = false;
        document.getElementById('results-container').style.display = 'none';
        document.getElementById('action-btn').style.display = 'block';
        document.getElementById('action-btn').innerText = '✨ ตรวจคำตอบและประเมินผล';
        
        let shuffledBank = [...masterBank];
        shuffleArray(shuffledBank);
        activeQuestions = shuffledBank.slice(0, 30);

        let html = '';
        activeQuestions.forEach((q, idx) => {
            html += `<div class="question-card" id="q-card-${idx}">
                <div class="question-title">ข้อที่ ${idx + 1}: ${q.q}</div>
                <div class="options-list">`;
            
            q.options.forEach((opt, optIdx) => {
                let optId = `q${idx}_opt${optIdx}`;
                html += `<label class="option-label" id="label-${optId}">
                    <input type="radio" name="q${idx}" value="${optIdx}" id="${optId}">
                    <span>${opt}</span>
                </label>`;
            });

            html += `</div>
                <div class="explanation" id="exp-${idx}">
                    <strong>คำอธิบาย:</strong> ${q.explanation}
                </div>
            </div>`;
        });

        document.getElementById('quiz-container').innerHTML = html;
        document.getElementById('info-box').innerHTML = '📌 <strong>กำลังทำข้อสอบชุดสุ่ม 30 ข้อ:</strong> เลือกคำตอบให้ครบทุกข้อแล้วกดตรวจคำตอบด้านล่าง';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function handleAction() {
        if (!isSubmitted) {
            gradeQuiz();
        } else {
            startNewQuiz();
        }
    }

    function gradeQuiz() {
        let score = 0;
        const total = activeQuestions.length;
        let unansweredCount = 0;

        activeQuestions.forEach((q, i) => {
            const radios = document.getElementsByName('q' + i);
            let selected = -1;
            for (let r of radios) {
                if (r.checked) {
                    selected = parseInt(r.value);
                    break;
                }
            }

            const expDiv = document.getElementById('exp-' + i);
            expDiv.style.display = 'block';

            for (let r of radios) {
                const lbl = document.getElementById('label-' + r.id);
                lbl.style.background = '#ffffff';
                lbl.style.borderColor = '#e2e8f0';
            }

            if (selected === -1) {
                unansweredCount++;
                expDiv.className = 'explanation incorrect-explanation';
                expDiv.innerHTML = '<strong>❌ ยังไม่ได้เลือกคำตอบ</strong> | คำตอบที่ถูกต้องคือ: ' + document.getElementById('q' + i + '_opt' + q.answer).nextElementSibling.innerText;
            } else {
                const correctOptLabel = document.getElementById('label-q' + i + '_opt' + q.answer);
                correctOptLabel.style.background = '#d1fae5';
                correctOptLabel.style.borderColor = '#10b981';

                if (selected === q.answer) {
                    score++;
                    expDiv.className = 'explanation';
                    expDiv.innerHTML = '<strong>✅ ถูกต้อง!</strong> ' + q.explanation;
                } else {
                    const selectedOptLabel = document.getElementById('label-q' + i + '_opt' + selected);
                    selectedOptLabel.style.background = '#fee2e2';
                    selectedOptLabel.style.borderColor = '#ef4444';
                    expDiv.className = 'explanation incorrect-explanation';
                    expDiv.innerHTML = '<strong>❌ ตอบผิด</strong> | คำตอบที่ถูกต้องคือ: ' + document.getElementById('q' + i + '_opt' + q.answer).nextElementSibling.innerText + '<br><strong>คำอธิบาย:</strong> ' + q.explanation;
                }
            }
        });

        const percentage = (score / total) * 100;
        document.getElementById('score-text').innerText = score + ' / ' + total;
        document.getElementById('percentage-text').innerText = 'คิดเป็น ' + percentage.toFixed(2) + '%';

        let feedback = '';
        if (percentage >= 80) {
            feedback = '🌟 ยอดเยี่ยมมาก! ผ่านเกณฑ์ระดับดีเยี่ยม';
        } else if (percentage >= 50) {
            feedback = '👍 ทำได้ดี! ผ่านเกณฑ์ความรู้พื้นฐาน';
        } else {
            feedback = '💪 สู้ๆ ครับ! ลองกดสุ่มชุดใหม่เพื่อฝึกทำซ้ำอีกครั้ง';
        }
        if (unansweredCount > 0) {
            feedback += ' (⚠️ ยังไม่ได้ตอบ ' + unansweredCount + ' ข้อ)';
        }
        document.getElementById('feedback-text').innerText = feedback;

        document.getElementById('results-container').style.display = 'block';
        document.getElementById('action-btn').style.display = 'none';
        isSubmitted = true;
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    document.addEventListener('DOMContentLoaded', () => {
        startNewQuiz();
    });
</script>
